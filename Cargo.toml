[package]
name = "windows-notch"
version = "0.1.0"
edition = "2021"
description = "Dynamic Island-style notch for Windows 11 with Spotify / Apple Music synced lyrics"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
serde = { version = "1", features = ["derive"] }
ureq = { version = "2", features = ["json"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Media_Control", "Foundation", "Storage_Streams"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"